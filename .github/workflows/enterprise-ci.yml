name: Enterprise application CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Test frontend
        run: npm --prefix frontend run test
      - name: Test backend
        run: ./backend/gradlew -p backend test
      - name: Verify legacy archive
        run: npm ci && npm run check

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build deployable container
        run: docker build --tag game-of-thrones-archive:test .
      - name: Start deployable container
        run: docker run --detach --name archive --publish 8080:8080 --env SPRING_PROFILES_ACTIVE=prod game-of-thrones-archive:test
      - name: Verify container readiness and API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then break; fi
            if [ "$attempt" = 30 ]; then docker logs archive; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/statistics | grep '"characters":196'
          curl --fail --silent http://127.0.0.1:8080/v3/api-docs | grep 'Game of Thrones Archive API'
          docker restart archive
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health/readiness; then break; fi
            if [ "$attempt" = 30 ]; then docker logs archive; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/statistics | grep '"characters":196'
      - name: Stop deployable container
        if: always()
        run: docker rm --force archive
