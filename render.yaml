services:
  - type: web
    name: game-of-thrones-enterprise
    runtime: docker
    plan: free
    branch: master
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: DATABASE_URL
        value: jdbc:h2:file:/tmp/game-of-thrones
