<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character — Game of Thrones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="stylesheet" href="css/theme.css">
<style>
  #profile-header { display: flex; gap: 22px; align-items: center; padding: 30px 0 10px; flex-wrap: wrap; }
  #profile-header .avatar { width: 96px; height: 96px; font-size: 34px; }
  #profile-header h1 { margin: 0 0 6px; }
  #profile-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  #bio-text { max-width: 760px; color: var(--text-dim); line-height: 1.6; margin-top: 14px; }

  #relations-list { list-style: none; padding: 0; }
  #relations-list li {
    display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--panel-border);
  }
  #relations-list li a { color: var(--text); font-weight: 600; }
  #relations-list .rel-label { color: var(--text-dim); font-size: 0.85rem; }

  #mini-graph-host { width: 100%; height: 480px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius); }

  .timeline-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--panel-border); }
  .timeline-item .season-badge { flex-shrink: 0; font-family: 'Cinzel', serif; color: var(--accent); font-size: 0.8rem; width: 62px; }
  .timeline-item h4 { margin: 0 0 4px; }
  .timeline-item p { margin: 0; color: var(--text-dim); font-size: 0.88rem; }

  .quote-mini { border-left: 3px solid var(--accent); padding: 10px 14px; margin: 10px 0; font-style: italic; color: var(--text-dim); background: var(--panel-bg); border-radius: 0 6px 6px 0; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="page-wrap" id="page-wrap">
    <div class="empty-state" id="not-found" style="display:none;">Character not found. <a href="characters.html">Back to Characters</a></div>

    <div id="profile-content" style="display:none;">
      <div id="profile-header"></div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="graph">Relations Graph</button>
        <button class="tab-btn" data-tab="timeline">Timeline</button>
      </div>

      <div class="tab-panel active" id="tab-overview">
        <div class="section">
          <div class="section-title">Relations</div>
          <ul id="relations-list"></ul>
        </div>
        <div class="section" id="quotes-section" style="display:none;">
          <div class="section-title">Quotes</div>
          <div id="quotes-mini"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-graph">
        <p class="text-dim">Character and their direct connections.</p>
        <div id="mini-graph-host"></div>
      </div>

      <div class="tab-panel" id="tab-timeline">
        <div id="char-timeline"></div>
      </div>
    </div>
  </div>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/common.js"></script>
  <script>
    let currentChar = null;

    function renderProfile() {
      const id = qs("id");
      currentChar = getCharacter(id);
      if (!currentChar) {
        document.getElementById("not-found").style.display = "block";
        return;
      }
      document.title = currentChar.name + " — Game of Thrones";
      document.getElementById("profile-content").style.display = "block";

      document.getElementById("profile-header").innerHTML = `
        ${avatarHTML(currentChar, 96)}
        <div>
          <h1 class="display" style="color:${currentChar.sigilColor}">${escapeHTML(currentChar.name)}</h1>
          <div id="profile-meta">
            <a class="badge house" href="house.html?id=${encodeURIComponent(currentChar.house)}" style="color:${currentChar.sigilColor};border-color:${currentChar.sigilColor}66">${escapeHTML(currentChar.house)}</a>
            <span class="badge ${currentChar.status}">${currentChar.status === 'alive' ? 'Alive' : 'Dead'}</span>
            <span class="text-dim" style="font-size:0.85rem;">Played by ${escapeHTML(currentChar.actor)}</span>
          </div>
          <p id="bio-text">${escapeHTML(currentChar.bio)}</p>
        </div>
      `;

      const rels = relationsFor(currentChar.id);
      document.getElementById("relations-list").innerHTML = rels.length
        ? rels.map(r => `
          <li>
            ${avatarHTML(r.other, 34)}
            <div>
              <a href="character.html?id=${r.other.id}">${escapeHTML(r.other.name)}</a>
              <div class="rel-label">${TYPE_ICON[r.rel.type]} ${escapeHTML(r.rel.label)}</div>
            </div>
          </li>`).join("")
        : `<li class="text-dim">No recorded relations.</li>`;

      const cq = quotesFor(currentChar.id);
      if (cq.length) {
        document.getElementById("quotes-section").style.display = "block";
        document.getElementById("quotes-mini").innerHTML = cq.map(q => `<div class="quote-mini">"${escapeHTML(q.text)}"</div>`).join("");
      }

      const evs = eventsFor(currentChar.id);
      document.getElementById("char-timeline").innerHTML = evs.length
        ? evs.map(e => `
          <div class="timeline-item">
            <div class="season-badge">S${e.season}</div>
            <div><h4>${escapeHTML(e.title)}</h4><p>${escapeHTML(e.summary)}</p></div>
          </div>`).join("")
        : `<div class="empty-state">No major timeline events recorded for this character.</div>`;

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
          if (btn.dataset.tab === "graph" && typeof d3 !== 'undefined') renderMiniGraph();
        });
      });
    }

    function renderMiniGraph() {
      const host = document.getElementById("mini-graph-host");
      host.innerHTML = "";
      const width = host.clientWidth || 700, height = host.clientHeight || 480;
      const svg = d3.select(host).append("svg").attr("width", width).attr("height", height);
      const zoomLayer = svg.append("g");
      svg.call(d3.zoom().scaleExtent([0.3, 4]).on("zoom", e => zoomLayer.attr("transform", e.transform)));

      const rels = relationsFor(currentChar.id);
      const nodes = [{ ...currentChar }, ...rels.map(r => ({ ...r.other }))];
      const links = rels.map(r => ({ source: currentChar.id, target: r.other.id, type: r.rel.type, label: r.rel.label }));

      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(110))
        .force("charge", d3.forceManyBody().strength(-220))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collide", d3.forceCollide(30));

      const link = zoomLayer.append("g").selectAll("line").data(links).join("line")
        .attr("stroke", d => RELATION_STYLE[d.type].color)
        .attr("stroke-dasharray", d => RELATION_STYLE[d.type].dash)
        .attr("stroke-width", 1.6).attr("opacity", 0.75);
      link.append("title").text(d => d.label);

      const node = zoomLayer.append("g").selectAll("circle").data(nodes).join("circle")
        .attr("r", d => d.id === currentChar.id ? 16 : 10)
        .attr("fill", d => d.sigilColor)
        .attr("opacity", d => d.status === "dead" ? 0.5 : 1)
        .attr("stroke", d => d.id === currentChar.id ? "var(--accent)" : "#000")
        .attr("stroke-width", d => d.id === currentChar.id ? 2.5 : 1)
        .style("cursor", "pointer")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
      node.append("title").text(d => d.name);
      node.on("click", (e, d) => { if (d.id !== currentChar.id) window.location.href = "character.html?id=" + d.id; });

      const label = zoomLayer.append("g").selectAll("text").data(nodes).join("text")
        .text(d => d.name).attr("font-size", 10).attr("fill", "var(--text)")
        .attr("dx", 14).attr("dy", 4).style("pointer-events", "none");

      sim.on("tick", () => {
        link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
        node.attr("cx", d => d.x).attr("cy", d => d.y);
        label.attr("x", d => d.x).attr("y", d => d.y);
      });
    }

    document.addEventListener("DOMContentLoaded", renderProfile);
  </script>
</body>
</html>
