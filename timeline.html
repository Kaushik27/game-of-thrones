<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline — Game of Thrones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  #season-scrubber { display: flex; gap: 6px; flex-wrap: wrap; margin: 20px 0; }
  .season-btn {
    padding: 10px 18px; border-radius: 6px; border: 1px solid var(--panel-border); background: var(--panel-bg);
    color: var(--text-dim); cursor: pointer; font-family: 'Cinzel', serif;
  }
  .season-btn.active { background: var(--accent); color: #14140f; border-color: var(--accent); font-weight: 700; }
  #tl-filters { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }

  #tl-track { position: relative; margin-top: 30px; padding-left: 26px; border-left: 2px solid var(--panel-border); }
  .tl-event { position: relative; margin-bottom: 26px; padding-left: 20px; }
  .tl-event::before {
    content: ""; position: absolute; left: -33px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }
  .tl-event .season-tag { color: var(--accent); font-family: 'Cinzel', serif; font-size: 0.78rem; }
  .tl-event h3 { margin: 4px 0 6px; }
  .tl-event p { margin: 0; color: var(--text-dim); font-size: 0.92rem; line-height: 1.5; }
  .tl-event .type-tag {
    display: inline-block; margin-top: 6px; font-size: 0.72rem; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--panel-border); color: var(--text-dim);
  }
  .tl-event .houses { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tl-event .houses a { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid; text-decoration: none; }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="page-wrap">
    <div class="hero" style="padding-top:36px;padding-bottom:6px;">
      <h1 class="display">Timeline of Westeros</h1>
      <p>Scrub through the seasons and filter by house or event type to trace how the War of the Five Kings became the war for the dawn — and the war for the throne.</p>
    </div>

    <div id="season-scrubber"></div>
    <div id="tl-filters">
      <label class="text-dim" style="font-size:0.85rem;">House:
        <select id="house-filter"><option value="">All</option></select>
      </label>
      <label class="text-dim" style="font-size:0.85rem;">Type:
        <select id="type-filter">
          <option value="">All</option>
          <option value="battle">Battle</option>
          <option value="death">Death</option>
          <option value="wedding">Wedding</option>
          <option value="coronation">Coronation</option>
          <option value="politics">Politics</option>
          <option value="other">Other</option>
        </select>
      </label>
      <span id="tl-count" class="text-dim" style="font-size:0.85rem;"></span>
    </div>

    <div id="tl-track"></div>
  </div>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/common.js"></script>
  <script>
    const TYPE_COLOR = { battle: "#c23b3b", death: "#8a2f2f", wedding: "#d97ba0", coronation: "#d4af37", politics: "#4a90d9", birth: "#4c7a3f", other: "#8a8a93" };
    let activeSeason = "all", activeHouse = "", activeType = "";

    function initScrubber() {
      const mount = document.getElementById("season-scrubber");
      mount.innerHTML = `<button class="season-btn active" data-season="all">All Seasons</button>` +
        SEASONS.map(s => `<button class="season-btn" data-season="${s}">Season ${s}</button>`).join("");
      mount.querySelectorAll(".season-btn").forEach(btn => btn.addEventListener("click", () => {
        mount.querySelectorAll(".season-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeSeason = btn.dataset.season;
        render();
      }));
    }

    function initFilters() {
      const houseSel = document.getElementById("house-filter");
      Object.keys(HOUSE_COLORS).forEach(h => {
        const opt = document.createElement("option");
        opt.value = h; opt.textContent = h;
        houseSel.appendChild(opt);
      });
      houseSel.addEventListener("change", e => { activeHouse = e.target.value; render(); });
      document.getElementById("type-filter").addEventListener("change", e => { activeType = e.target.value; render(); });
    }

    function render() {
      const filtered = events.filter(e =>
        (activeSeason === "all" || e.season === Number(activeSeason)) &&
        (!activeHouse || e.houses.includes(activeHouse)) &&
        (!activeType || e.type === activeType)
      ).sort((a, b) => a.season - b.season);

      document.getElementById("tl-count").textContent = `${filtered.length} event${filtered.length === 1 ? '' : 's'}`;
      document.getElementById("tl-track").innerHTML = filtered.map(e => `
        <div class="tl-event">
          <div class="season-tag">SEASON ${e.season}</div>
          <h3>${escapeHTML(e.title)}</h3>
          <p>${escapeHTML(e.summary)}</p>
          <span class="type-tag" style="color:${TYPE_COLOR[e.type]};border-color:${TYPE_COLOR[e.type]}66;">${e.type}</span>
          <div class="houses">
            ${e.houses.map(h => `<a href="house.html?id=${encodeURIComponent(h)}" style="color:${getHouseColor(h)};border-color:${getHouseColor(h)}66;">${h}</a>`).join("")}
          </div>
        </div>
      `).join("") || `<div class="empty-state">No events match these filters.</div>`;
    }

    document.addEventListener("DOMContentLoaded", () => { initScrubber(); initFilters(); render(); });
  </script>
</body>
</html>
