spring.application.name=game-of-thrones-api
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/game-of-thrones;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=Game of Thrones Archive API
info.app.description=Portfolio-ready API for the living Westeros archive

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=OPENAPI_3_0

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.max-http-request-header-size=16KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
