<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map of Westeros — Game of Thrones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<style>
  #map-layout { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
  #map-host { flex: 1 1 480px; min-width: 300px; background: #0a1210; border: 1px solid var(--panel-border); border-radius: var(--radius); overflow: hidden; }
  #map-svg { width: 100%; height: auto; display: block; }
  .region-poly { stroke: #0a1210; stroke-width: 2; cursor: pointer; opacity: 0.75; transition: opacity 0.15s; }
  .region-poly:hover { opacity: 1; }
  .region-poly.selected { opacity: 1; stroke: var(--accent); stroke-width: 3; }
  .region-label { font-family: 'Cinzel', serif; font-size: 11px; fill: #fff; pointer-events: none; text-anchor: middle; text-shadow: 0 1px 2px #000; }
  .region-marker { pointer-events: none; }

  #map-tooltip {
    position: fixed; pointer-events: none; background: var(--panel-bg-alt); border: 1px solid var(--panel-border);
    padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; display: none; z-index: 50; max-width: 220px;
  }

  #map-side { width: 320px; flex-shrink: 0; }
  #region-detail { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius); padding: 18px; min-height: 200px; }
  #region-detail h2 { margin: 0 0 4px; }
  #region-detail .sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 10px; }
  #region-char-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 260px; overflow-y: auto; }
  .region-char-row { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
  .region-char-row .name { font-size: 0.85rem; }
  #region-events { margin-top: 14px; }
  #region-events .timeline-item { padding: 8px 0; }
  #region-events .season-badge { color: var(--accent); font-family: 'Cinzel', serif; font-size: 0.75rem; }

  @media (max-width: 860px) { #map-layout { flex-direction: column; } #map-side { width: 100%; } }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <div class="page-wrap">
    <div class="hero" style="padding-top:36px;padding-bottom:6px;">
      <h1 class="display">Map of Westeros</h1>
      <p>A stylized map of the Seven Kingdoms. Hover a region to see its ruling house, click to see its characters and history.</p>
    </div>

    <div id="map-layout">
      <div id="map-host">
        <svg id="map-svg" viewBox="0 0 600 800"></svg>
      </div>
      <div id="map-side">
        <div id="region-detail">
          <div class="empty-state">Click a region on the map to explore it.</div>
        </div>
      </div>
    </div>
  </div>
  <div id="map-tooltip"></div>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/common.js"></script>
  <script>
    function renderMap() {
      const svg = document.getElementById("map-svg");
      const ns = "http://www.w3.org/2000/svg";
      MAP_REGIONS.forEach(region => {
        const color = getHouseColor(region.house);
        const poly = document.createElementNS(ns, "polygon");
        poly.setAttribute("points", region.polygon);
        poly.setAttribute("fill", color);
        poly.setAttribute("class", "region-poly");
        poly.dataset.id = region.id;
        svg.appendChild(poly);

        const label = document.createElementNS(ns, "text");
        label.setAttribute("x", region.marker[0]);
        label.setAttribute("y", region.marker[1] - 8);
        label.setAttribute("class", "region-label");
        label.textContent = region.name;
        svg.appendChild(label);

        const marker = document.createElementNS(ns, "text");
        marker.setAttribute("x", region.marker[0]);
        marker.setAttribute("y", region.marker[1] + 10);
        marker.setAttribute("class", "region-marker");
        marker.setAttribute("text-anchor", "middle");
        marker.setAttribute("font-size", "16");
        marker.textContent = "🏰";
        svg.appendChild(marker);

        poly.addEventListener("mouseenter", (e) => showTooltip(e, region));
        poly.addEventListener("mousemove", (e) => moveTooltip(e));
        poly.addEventListener("mouseleave", hideTooltip);
        poly.addEventListener("click", () => selectRegion(region.id));
      });
    }

    function showTooltip(e, region) {
      const tip = document.getElementById("map-tooltip");
      tip.innerHTML = `<strong style="color:${getHouseColor(region.house)}">${region.name}</strong><br>Seat: ${region.seat}<br>Controlled by House ${region.house}`;
      tip.style.display = "block";
      moveTooltip(e);
    }
    function moveTooltip(e) {
      const tip = document.getElementById("map-tooltip");
      tip.style.left = (e.clientX + 16) + "px";
      tip.style.top = (e.clientY + 12) + "px";
    }
    function hideTooltip() { document.getElementById("map-tooltip").style.display = "none"; }

    function selectRegion(id) {
      document.querySelectorAll(".region-poly").forEach(p => p.classList.toggle("selected", p.dataset.id === id));
      const region = MAP_REGIONS.find(r => r.id === id);
      if (!region) return;
      const color = getHouseColor(region.house);
      const members = charactersByHouse(region.house).slice(0, 12);
      const evs = eventsForHouse(region.house).slice(0, 6);

      document.getElementById("region-detail").innerHTML = `
        <h2 class="display" style="color:${color}">${region.name}</h2>
        <div class="sub">Seat: ${region.seat} · House ${region.house}</div>
        <p class="text-dim" style="font-size:0.88rem;">${region.blurb}</p>
        <a href="house.html?id=${encodeURIComponent(region.house)}">View House ${region.house} →</a>
        <div id="region-char-list">
          ${members.map(c => `
            <a class="region-char-row" href="character.html?id=${c.id}">
              ${avatarHTML(c, 30)}
              <span class="name">${escapeHTML(c.name)}</span>
            </a>`).join("") || `<div class="text-dim">No notable characters recorded.</div>`}
        </div>
        <div id="region-events">
          <h3 style="font-size:1rem;">Notable Events</h3>
          ${evs.length ? evs.map(e => `
            <div class="timeline-item">
              <div class="season-badge">S${e.season}</div>
              <div><strong>${escapeHTML(e.title)}</strong><p style="margin:2px 0 0;color:var(--text-dim);font-size:0.82rem;">${escapeHTML(e.summary)}</p></div>
            </div>`).join("") : `<div class="text-dim" style="font-size:0.85rem;">No major events recorded.</div>`}
        </div>
      `;
    }

    document.addEventListener("DOMContentLoaded", renderMap);
  </script>
</body>
</html>
