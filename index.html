<style>
  /* ---------- Home ---------- */
  .feature-grid {
    display: grid; gap: 18px; margin-top: 20px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .feature-card .icon { color: var(--card-accent, var(--accent)); }
  .feature-card h3 { margin: 10px 0 6px; }
  .feature-card p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; margin: 0; }
  /* Spotlight/featured card — one larger, differently-laid-out card mixed
     into an otherwise uniform grid so the home page reads as more than a
     repeating block of identical boxes. */
  .feature-card.spotlight {
    grid-column: span 2;
    display: flex; align-items: center; gap: 22px;
    padding: 28px;
    background: linear-gradient(120deg, var(--card-accent, var(--accent))14, var(--panel-bg) 55%);
  }
  .feature-card.spotlight .icon { flex-shrink: 0; }
  .feature-card.spotlight .icon svg { width: 46px; height: 46px; }
  .feature-card.spotlight h3 { font-size: 1.7rem; margin: 0 0 8px; }
  .feature-card.spotlight p { font-size: 0.95rem; max-width: 46ch; }
  @media (max-width: 640px) {
    .feature-card.spotlight { grid-column: span 1; flex-direction: column; text-align: center; padding: 24px 20px; }
  }
  .stat-row {
    display: flex; gap: 0; justify-content: center; flex-wrap: wrap; margin-top: 32px;
    background: linear-gradient(var(--surface-tint), var(--surface-tint)), var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px;
    max-width: fit-content;
    margin-left: auto; margin-right: auto;
  }
  .stat { text-align: center; padding: 12px 26px; position: relative; }
  .stat:not(:last-child)::after {
    content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 1px; height: 60%; background: var(--panel-border);
  }
  .stat .num { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--accent); line-height: 1; }
  .stat .label { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px; }
  @media (max-width: 640px) { .stat-row { border-radius: var(--radius); } .stat { padding: 10px 16px; } }
  .house-strip { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .house-strip a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--panel-border);
    font-weight: 500; font-size: 0.82rem; color: var(--text); text-decoration: none;
    transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .house-strip a:hover { text-decoration: none; transform: translateY(-2px); }

  /* ---------- Characters directory / relations graph ---------- */
  #controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 20px 0; }
  #search-input { width: 260px; }
  .char-card .meta { min-width: 0; }
  .char-card .name { font-family: 'Cinzel', serif; font-size: 0.95rem; margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-card .sub { font-size: 0.78rem; color: var(--text-dim); }
  /* The most-connected characters (by relation count) render as larger,
     side-by-side "featured" cards spanning 2 grid columns — a data-driven
     variety signal so the directory isn't a uniform wall of identical
     tiles. */
  #char-grid { grid-auto-flow: dense; }
  .char-card.featured {
    grid-column: span 2;
    display: flex; align-items: center; gap: 16px;
  }
  .char-card.featured .name { font-size: 1.15rem; white-space: normal; }
  @media (max-width: 640px) { .char-card.featured { grid-column: span 1; } }
  #result-count { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 10px; }
  .portrait-coverage {
    display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center;
    margin: -2px 0 14px; color: var(--text); font-size: 0.76rem; letter-spacing: 0.02em;
  }
  .portrait-coverage strong { color: var(--accent); font-family: 'Cinzel', serif; font-size: 0.9rem; }
  .portrait-coverage .text-dim { flex-basis: 100%; font-size: 0.72rem; }
  .char-card .actor-line { color: var(--text-dim); font-size: 0.72rem; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .portrait-kind { display: inline-block; margin-top: 7px; padding: 2px 7px; border: 1px solid var(--panel-border); border-radius: 999px; font-size: 0.63rem; letter-spacing: 0.07em; text-transform: uppercase; }
  .portrait-kind--photo { color: #cbb36b; border-color: #cbb36b66; }
  .portrait-kind--illustration { color: var(--text-faint); }
  .portrait-gap-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .portrait-gap-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  #graph-detail li:hover { color: var(--accent); }

  /* ---------- Houses ---------- */
  .house-card { text-align: center; padding: 26px 18px; }
  .house-sigil { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; }
  .house-card h3 { margin: 0 0 4px; }
  .house-card .words { font-style: italic; color: var(--text-dim); font-size: 0.85rem; margin: 4px 0; }
  .house-card .seat { font-size: 0.8rem; color: var(--text-faint); }
  .house-card .count { margin-top: 10px; font-size: 0.78rem; color: var(--text-dim); }

  /* ---------- Timeline ---------- */
  .season-btn {
    padding: 10px 18px; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel-bg);
    color: var(--text-dim); cursor: pointer; font-weight: 500; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .season-btn.active { background: var(--accent); color: #14140f; border-color: var(--accent); font-weight: 700; }
  .tl-event { position: relative; }
  .tl-event::before {
    content: ""; position: absolute; left: -33px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ---------- Quiz ---------- */
  .mode-card .icon { display: flex; justify-content: center; color: var(--accent); }
  .mode-card h3 { margin: 8px 0 4px; }
  .mode-card.active { border-color: var(--accent); background: var(--panel-bg-alt); }
  @media (max-width: 480px) { #answer-grid { grid-template-columns: 1fr !important; } }

  /* ---------- Quote wall ---------- */
  .quote-card::before {
    content: "\201C"; position: absolute; top: -18px; left: 10px; font-family: 'Cinzel', serif;
    font-size: 5rem; color: rgba(212,175,55,0.12); line-height: 1;
  }

  /* ---------- Map ----------
     The parchment map is a light object on a dark site. That is a deliberate
     choice, not an accident: it is treated as a framed physical artefact —
     inked border, gold hairline inset, warm outer glow — and the SVG carries
     its own vignette so the paper darkens towards its own edges. The result
     reads as a map mounted on the page rather than a white rectangle pasted
     onto it. */
  #map-layout { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; align-items: flex-start; }
  #map-host { flex: 1 1 480px; min-width: 280px; }
  #map-side { width: 320px; flex-shrink: 0; }
  #region-detail {
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: var(--radius); padding: 18px; min-height: 200px;
  }
  #map-frame {
    position: relative;
    border-radius: 4px;
    padding: 9px;
    background:
      linear-gradient(150deg, #2a2119, #17120c 60%, #221a12);
    box-shadow:
      0 0 0 1px rgba(212,175,55,0.30),
      0 18px 46px rgba(0,0,0,0.6),
      0 0 90px rgba(212,175,55,0.055);
  }
  #map-frame::after {
    /* Gold hairline inset, sitting just inside the frame's dark border. */
    content: ""; position: absolute; inset: 5px;
    border: 1px solid rgba(212,175,55,0.34);
    border-radius: 3px; pointer-events: none;
  }
  #map-svg {
    width: 100%; height: auto; display: block; border-radius: 2px;
    cursor: grab; touch-action: none;
    background: #cbbd98;
  }
  #map-svg:active { cursor: grabbing; }

  .region-poly { cursor: pointer; transition: fill-opacity var(--dur-fast) var(--ease-out); }
  .region-poly.hovered { fill-opacity: 0.44; }
  .region-poly.selected { fill-opacity: 0.56; stroke: #3a2c18; stroke-width: 1.8; stroke-dasharray: none; }

  /* Cartographic type: serif, letterspaced, inked rather than pure black. */
  .region-label {
    font-family: 'Cinzel', serif; font-weight: 600;
    fill: #40301b; letter-spacing: 0.22em;
    text-anchor: middle; pointer-events: none;
    paint-order: stroke fill;
    stroke: rgba(233,220,189,0.75); stroke-width: 2.4px; stroke-linejoin: round;
  }
  .sea-label {
    font-family: 'Cormorant Garamond', 'Cinzel', serif; font-style: italic;
    fill: #7b6538; letter-spacing: 0.30em; text-anchor: middle;
    pointer-events: none; opacity: 0.85; transition: opacity .2s;
  }
  .settlement-label {
    font-family: 'Cinzel', serif; fill: #4a3a24; font-size: 6.4px;
    letter-spacing: 0.04em; pointer-events: none;
    opacity: 0; transition: opacity .22s var(--ease-out);
    paint-order: stroke fill;
    stroke: rgba(233,220,189,0.85); stroke-width: 1.8px; stroke-linejoin: round;
  }
  /* Settlement names would collide with terrain at low zoom, so they are
     withheld until there is room for them. */
  #map-svg.zoomed-in .settlement-label { opacity: 1; }
  .settlement { pointer-events: none; }

  #map-controls {
    position: absolute; right: 16px; top: 16px;
    display: flex; flex-direction: column; gap: 5px;
  }
  #map-controls button {
    width: 30px; height: 30px; border-radius: 4px; cursor: pointer;
    border: 1px solid rgba(74,58,36,0.55);
    background: rgba(233,220,189,0.94); color: #3a2c18;
    font-family: 'Cinzel', serif; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-fast) var(--ease-out);
  }
  #map-controls button:hover { background: #fff6e2; }
  #map-hint {
    position: absolute; left: 18px; bottom: 16px;
    font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase;
    color: rgba(74,58,36,0.62); pointer-events: none;
  }
  #map-tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 50;
    background: var(--panel-bg-alt); border: 1px solid var(--panel-border);
    padding: 8px 12px; border-radius: 6px; font-size: 0.82rem; max-width: 220px;
  }

  @media (max-width: 860px) {
    #map-layout { flex-direction: column; }
    #map-side { width: 100% !important; }
  }
  @media (max-width: 560px) {
    /* At phone width the frame's padding eats real estate and the hint text
       competes with the map itself, so both are pared back. */
    #map-frame { padding: 5px; }
    #map-frame::after { inset: 2px; }
    #map-hint { display: none; }
    #map-controls { right: 8px; top: 8px; }
    #map-controls button { width: 34px; height: 34px; }
  }
</style>
