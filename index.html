<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Thrones — Westeros Reference</title>
<meta name="description" content="An interactive reference site for Game of Thrones: character hub, house pages, an interactive map, timeline, battles, quiz and quote wall.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<link rel="stylesheet" href="css/theme.css">
<style>
  /* ---------- Home ---------- */
  .feature-grid {
    display: grid; gap: 18px; margin-top: 20px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .feature-card .icon { color: var(--card-accent, var(--accent)); }
  .feature-card h3 { margin: 10px 0 6px; }
  .feature-card p { color: var(--text-dim); font-size: 0.9rem; line-height: 1.5; margin: 0; }
  /* Spotlight/featured card — one larger, differently-laid-out card mixed
     into an otherwise uniform grid so the home page reads as more than a
     repeating block of identical boxes. */
  .feature-card.spotlight {
    grid-column: span 2;
    display: flex; align-items: center; gap: 22px;
    padding: 28px;
    background: linear-gradient(120deg, var(--card-accent, var(--accent))14, var(--panel-bg) 55%);
  }
  .feature-card.spotlight .icon { flex-shrink: 0; }
  .feature-card.spotlight .icon svg { width: 46px; height: 46px; }
  .feature-card.spotlight h3 { font-size: 1.7rem; margin: 0 0 8px; }
  .feature-card.spotlight p { font-size: 0.95rem; max-width: 46ch; }
  @media (max-width: 640px) {
    .feature-card.spotlight { grid-column: span 1; flex-direction: column; text-align: center; padding: 24px 20px; }
  }
  .stat-row {
    display: flex; gap: 0; justify-content: center; flex-wrap: wrap; margin-top: 32px;
    background: linear-gradient(var(--surface-tint), var(--surface-tint)), var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 6px;
    max-width: fit-content;
    margin-left: auto; margin-right: auto;
  }
  .stat { text-align: center; padding: 12px 26px; position: relative; }
  .stat:not(:last-child)::after {
    content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 1px; height: 60%; background: var(--panel-border);
  }
  .stat .num { font-family: 'Cinzel', serif; font-size: 2rem; color: var(--accent); line-height: 1; }
  .stat .label { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px; }
  @media (max-width: 640px) { .stat-row { border-radius: var(--radius); } .stat { padding: 10px 16px; } }
  .house-strip { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .house-strip a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--panel-border);
    font-weight: 500; font-size: 0.82rem; color: var(--text); text-decoration: none;
    transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .house-strip a:hover { text-decoration: none; transform: translateY(-2px); }

  /* ---------- Characters directory / relations graph ---------- */
  #controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 20px 0; }
  #search-input { width: 260px; }
  .char-card .meta { min-width: 0; }
  .char-card .name { font-family: 'Cinzel', serif; font-size: 0.95rem; margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .char-card .sub { font-size: 0.78rem; color: var(--text-dim); }
  /* The most-connected characters (by relation count) render as larger,
     side-by-side "featured" cards spanning 2 grid columns — a data-driven
     variety signal so the directory isn't a uniform wall of identical
     tiles. */
  #char-grid { grid-auto-flow: dense; }
  .char-card.featured {
    grid-column: span 2;
    display: flex; align-items: center; gap: 16px;
  }
  .char-card.featured .name { font-size: 1.15rem; white-space: normal; }
  @media (max-width: 640px) { .char-card.featured { grid-column: span 1; } }
  #result-count { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 10px; }
  #graph-detail li:hover { color: var(--accent); }

  /* ---------- Houses ---------- */
  .house-card { text-align: center; padding: 26px 18px; }
  .house-sigil { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid; }
  .house-card h3 { margin: 0 0 4px; }
  .house-card .words { font-style: italic; color: var(--text-dim); font-size: 0.85rem; margin: 4px 0; }
  .house-card .seat { font-size: 0.8rem; color: var(--text-faint); }
  .house-card .count { margin-top: 10px; font-size: 0.78rem; color: var(--text-dim); }

  /* ---------- Timeline ---------- */
  .season-btn {
    padding: 10px 18px; border-radius: var(--radius-sm); border: 1px solid var(--panel-border); background: var(--panel-bg);
    color: var(--text-dim); cursor: pointer; font-weight: 500; transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .season-btn.active { background: var(--accent); color: #14140f; border-color: var(--accent); font-weight: 700; }
  .tl-event { position: relative; }
  .tl-event::before {
    content: ""; position: absolute; left: -33px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ---------- Quiz ---------- */
  .mode-card .icon { display: flex; justify-content: center; color: var(--accent); }
  .mode-card h3 { margin: 8px 0 4px; }
  .mode-card.active { border-color: var(--accent); background: var(--panel-bg-alt); }
  @media (max-width: 480px) { #answer-grid { grid-template-columns: 1fr !important; } }

  /* ---------- Quote wall ---------- */
  .quote-card::before {
    content: "\201C"; position: absolute; top: -18px; left: 10px; font-family: 'Cinzel', serif;
    font-size: 5rem; color: rgba(212,175,55,0.12); line-height: 1;
  }

  /* ---------- Map ---------- */
  @media (max-width: 860px) { #map-layout { flex-direction: column; } #map-side { width: 100% !important; } }
</style>
</head>
<body>
  <div id="site-nav"></div>
  <main id="app"></main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/actor-photos.js"></script>
  <script src="js/events.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/battles.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/sigils.js"></script>
  <script src="js/avatars.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
